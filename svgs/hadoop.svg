<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="hbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1A252F;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="16" fill="url(#hbg)"/>
  <!-- Hadoop elephant silhouette (simplified) -->
  <g transform="translate(64,72)" fill="#F39C12" opacity="0.9">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="34" ry="22"/>
    <!-- Head -->
    <circle cx="28" cy="-10" r="14"/>
    <!-- Trunk -->
    <path d="M40,-6 Q52,0 48,16 Q46,22 40,20 Q44,10 40,4" fill="#F39C12"/>
    <!-- Ear -->
    <ellipse cx="24" cy="-18" rx="8" ry="12" fill="#E67E22" opacity="0.6"/>
    <!-- Eye -->
    <circle cx="33" cy="-12" r="2" fill="#1A252F"/>
    <!-- Front legs -->
    <rect x="-20" y="14" width="8" height="20" rx="3"/>
    <rect x="-8" y="14" width="8" height="20" rx="3"/>
    <!-- Back legs -->
    <rect x="12" y="14" width="8" height="20" rx="3"/>
    <rect x="24" y="14" width="8" height="20" rx="3"/>
  </g>
  <!-- Data nodes (HDFS blocks) -->
  <rect x="14" y="14" width="12" height="12" rx="3" fill="#E74C3C" opacity="0.8"/>
  <rect x="30" y="14" width="12" height="12" rx="3" fill="#E74C3C" opacity="0.6"/>
  <rect x="14" y="30" width="12" height="12" rx="3" fill="#E74C3C" opacity="0.5"/>
</svg>
