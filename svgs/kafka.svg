<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="kbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#231F20;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#444;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="16" fill="url(#kbg)"/>
  <!-- Kafka "K" lettermark -->
  <text x="64" y="82" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="56" text-anchor="middle" fill="#fff" letter-spacing="-2">K</text>
  <!-- Three nodes / data streams -->
  <circle cx="24" cy="42" r="6" fill="#FF7F00" opacity="0.85"/>
  <circle cx="64" cy="26" r="6" fill="#FF7F00" opacity="0.85"/>
  <circle cx="104" cy="42" r="6" fill="#FF7F00" opacity="0.85"/>
  <!-- Stream lines between nodes -->
  <line x1="30" y1="42" x2="58" y2="30" stroke="#FF7F00" stroke-width="2" opacity="0.6"/>
  <line x1="70" y1="30" x2="98" y2="38" stroke="#FF7F00" stroke-width="2" opacity="0.6"/>
  <line x1="98" y1="46" x2="58" y2="98" stroke="#FF7F00" stroke-width="2" opacity="0.5"/>
  <line x1="30" y1="46" x2="58" y2="98" stroke="#FF7F00" stroke-width="2" opacity="0.5"/>
</svg>
