# documentation: https://kafka.apache.org/documentation/
# slogan: Apache Kafka is an open-source event streaming platform for collecting, processing, storing, and integrating data at scale.
# category: messaging
# tags: event streaming, message broker, kafka, pub-sub, stream processing, messaging, data pipeline
# logo: svgs/kafka.svg
# port: 9092

services:
  kafka:
    image: apache/kafka:latest
    hostname: "kafka"
    environment:
      - SERVICE_URL_KAFKA_9092
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://${SERVICE_FQDN_KAFKA}:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-cluster.sh --bootstrap-server localhost:9092 cluster-id 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    volumes:
      - kafka-data:/var/lib/kafka/data

volumes:
  kafka-data:
